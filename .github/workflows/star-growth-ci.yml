name: Star growth regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test Python data preparation and growth metrics
        run: python3 -m unittest discover -s tests -p 'test*.py' -v
      - name: Test JavaScript catalog and ranking logic
        run: node --test tests/*.test.cjs
      - name: Verify generated static page is up to date
        run: python3 scripts/build.py --check
